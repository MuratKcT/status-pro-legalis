<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A2E"/>
      <stop offset="100%" style="stop-color:#003399"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE066"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Scales of justice -->
  <!-- Center pole -->
  <rect x="31" y="14" width="2" height="36" fill="url(#gold)" rx="1"/>

  <!-- Top bar -->
  <rect x="16" y="20" width="32" height="2.5" fill="url(#gold)" rx="1.2"/>

  <!-- Left chain -->
  <line x1="20" y1="22.5" x2="20" y2="32" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right chain -->
  <line x1="44" y1="22.5" x2="44" y2="32" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left pan -->
  <path d="M14 32 Q20 38 26 32" stroke="#FFD700" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Right pan -->
  <path d="M38 32 Q44 38 50 32" stroke="#FFD700" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Base -->
  <rect x="26" y="49" width="12" height="2.5" fill="url(#gold)" rx="1.2"/>
  <rect x="28.5" y="48" width="7" height="2" fill="url(#gold)" rx="1"/>

  <!-- Gold dot at top of pole -->
  <circle cx="32" cy="14" r="2.5" fill="url(#gold)"/>

  <!-- Stars (EU style, subtle) -->
  <circle cx="10" cy="10" r="1.2" fill="#FFD700" opacity="0.5"/>
  <circle cx="54" cy="10" r="1.2" fill="#FFD700" opacity="0.5"/>
  <circle cx="10" cy="54" r="1.2" fill="#FFD700" opacity="0.5"/>
  <circle cx="54" cy="54" r="1.2" fill="#FFD700" opacity="0.5"/>
</svg>
